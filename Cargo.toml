[package]
name = "pubky-dispatch-push-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
description = "Standalone reference push notification relay for Pubky Dispatch"
license = "MIT"
repository = "https://github.com/pubky/pubky-dispatch-push-relay"
publish = false

[dependencies]
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
curve25519-dalek = "5"
ed25519-dalek = "3"
getrandom = "0.3"
ipnet = "2"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "http2", "json"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "tls-rustls-ring-webpki"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
hex = "0.4"
http-body = "1"
http-body-util = "0.1"
rand_core = { version = "0.6", features = ["getrandom"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev.package."*"]
opt-level = 2
